<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>30 SECONDS : THROUGH THE WINDOW - nora</title>

  <!-- Google Fonts: 手書き風フォント (Klee One) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      /* 全体背景画像の設定 */
      background: url('images/bg.png') no-repeat center center fixed;
      background-size: cover;
      color: #1a1a1a;
      font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      overflow-y: auto;
      user-select: none;
      position: relative;
    }

    /* 左上：NORAロゴ＆コピー */
    .brand-header {
      position: absolute;
      top: 32px;
      left: 36px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
      z-index: 10;
    }
    .brand-logo {
      height: 24px;
      width: auto;
      object-fit: contain;
    }
    .brand-tagline {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: #555550;
      font-weight: 300;
    }

    /* 右下：作品名＆制作年 */
    .work-info {
      position: absolute;
      bottom: 32px;
      right: 36px;
      text-align: right;
      z-index: 10;
    }
    .signature {
      display: block;
      width: 90px;
      height: auto;
      margin-top: 14px;
      margin-left: auto;
      opacity: 0.7;
    }
    .work-title {
      font-size: 0.78rem;
      letter-spacing: 0.22em;
      color: #2c2c2a;
      font-weight: 400;
    }
    .work-year {
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      color: #666660;
      margin-top: 3px;
    }

    /* === 全体レイアウト（左：ボタン / 中央：画像 / 右：テキスト） === */
    .main-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 90vw;
      max-width: 1400px;
      z-index: 5;
    }

    /* 1. 左側：6つのボタン領域（縦並び配置） */
    .controls-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 20px;
      padding-right: 40px;
    }

    .track-btn {
      background: none;
      border: none;
      color: #666660;
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      cursor: pointer;
      padding: 6px 4px;
      transition: all 0.35s ease;
      position: relative;
      text-align: right;
    }

    .track-btn:hover {
      color: #1a1a1a;
    }

    .track-btn.active {
      color: #1a1a1a;
      font-weight: 500;
    }

    .track-btn.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 1px;
      background-color: #1a1a1a;
    }

    /* 2. 中央：画像領域 */
    .image-container {
      position: relative;
      height: 68vh;
      aspect-ratio: 1 / 1;
      background-color: #eae8e3;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.12), 0 4px 16px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      flex-shrink: 0;
    }

    .window-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 1.2s ease-in-out;
      position: absolute;
      top: 0;
      left: 0;
      opacity: 0;
    }

    .window-image.active {
      opacity: 1;
    }

    .timer-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 2px;
      background-color: rgba(26, 26, 26, 0.4);
      width: 0%;
      transition: width 0.1s linear;
      z-index: 6;
    }

    /* 3. 右側：詩（テキスト）領域 */
    .poem-right {
      flex: 1;
      padding-left: 40px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      position: relative;
    }

    .poem-text {
      color: #2a2a28;
      font-family: 'Klee One', cursive, serif;
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.8;
      letter-spacing: 0.12em;
      writing-mode: horizontal-tb;
      opacity: 0;
      transition: opacity 1.5s ease-in-out;
      pointer-events: none;
      max-width: 360px;
    }

    .poem-text.visible {
      opacity: 0.9;
    }

    /* コンセプト表示 */
    .concept-text {
      color: #2a2a28;
      font-family: 'Klee One', cursive, serif;
      font-size: 0.88rem;
      font-weight: 400;
      line-height: 1.85;
      letter-spacing: 0.08em;
      max-width: 360px;
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .concept-text p + p {
      margin-top: 1.2em;
    }

    #concept-area.is-hidden .concept-text {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
    }

    #concept-area .poem-text {
      position: absolute;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      max-width: 360px;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    #concept-area .poem-text.visible {
      opacity: 0.9;
      transform: translateY(0);
    }

    /* ==========================================
       スマホ・タブレット用 レスポンシブ修正
       ========================================== */
    @media (max-width: 900px) {
      body {
        height: auto;
        padding: 20px 16px 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ヘッダーの固定解除 */
      .brand-header {
        position: relative;
        top: 0;
        left: 0;
        width: 100%;
        align-items: center;
        text-align: center;
        margin-bottom: 24px;
      }

      /* コンテナの固定解除（上下に並べる） */
      .main-container {
        position: relative;
        top: 0;
        left: 0;
        transform: none;
        flex-direction: column;
        width: 100%;
        max-width: 100%;
      }

      /* ボタン群を横並びで整理 */
      .controls-left {
        flex: none;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        padding-right: 0;
        margin-bottom: 20px;
        gap: 8px 16px;
        width: 100%;
      }

      .track-btn {
        text-align: center;
        font-size: 0.75rem;
        padding: 6px 8px;
      }

      /* 画像エリアのスマホ最適化 */
      .image-container {
        width: 100%;
        max-width: 340px;
        height: auto;
        aspect-ratio: 1 / 1;
        margin: 0 auto 24px;
      }

      /* 右側テキストエリアを中央寄せに */
      .poem-right {
        flex: none;
        padding-left: 0;
        width: 100%;
        justify-content: center;
        text-align: center;
        margin-bottom: 32px;
      }

      .concept-text, .poem-text, #concept-area .poem-text {
        text-align: center;
        margin: 0 auto;
      }

      /* フッター情報を最下部に流す */
      .work-info {
        position: relative;
        bottom: 0;
        right: 0;
        width: 100%;
        text-align: center;
        margin-top: 16px;
      }

      .signature {
        margin: 12px auto 0;
      }
    }
  </style>
</head>
<body>

  <!-- 左上：NORAロゴ＆コピー -->
  <div class="brand-header">
    <a href="https://cyber-nora.github.io/HP-nora/" style="text-decoration: none; display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <img src="./images/logo.png" alt="nora" class="brand-logo" id="logo-img" onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';">
      <span id="logo-fallback" style="display:none; font-weight:bold; font-size:1.1rem; letter-spacing:0.15em; color:#1a1a1a;">nora</span>
    </a>
    <span class="brand-tagline">音は、時代を旅する。</span>
  </div>

  <!-- 主構造（左：ボタン / 中央：画像固定 / 右：テキスト固定） -->
  <div class="main-container">
    
    <!-- 左側：6つのボタン -->
    <div class="controls-left">
      <button class="track-btn" onclick="playTrack('morning')">MORNING</button>
      <button class="track-btn" onclick="playTrack('daytime')">DAYTIME</button>
      <button class="track-btn" onclick="playTrack('wind')">WIND</button>
      <button class="track-btn" onclick="playTrack('rain')">RAIN</button>
      <button class="track-btn" onclick="playTrack('last_train')">LAST TRAIN</button>
      <button class="track-btn" onclick="playTrack('night')">NIGHT</button>
    </div>

    <!-- 中央：画像 -->
    <div class="image-container">
      <img src="images/base.jpg" alt="Window Base" class="window-image active" id="img-base">
      <img src="images/01_morning.jpg" alt="Morning" class="window-image" id="img-morning">
      <img src="images/02_daytime.jpg" alt="Daytime" class="window-image" id="img-daytime">
      <img src="images/03_wind.jpg" alt="Wind" class="window-image" id="img-wind">
      <img src="images/04_rain.jpg" alt="Rain" class="window-image" id="img-rain">
      <img src="images/05_last_train.jpg" alt="Last Train" class="window-image" id="img-last_train">
      <img src="images/06_night.jpg" alt="Night" class="window-image" id="img-night">

      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <!-- 右側：コンセプト / 再生中の詩 -->
    <div class="poem-right" id="concept-area">
      <div class="concept-text">
        <p>窓の外を眺めると、1本の木がある。</p>
        <p>いつもそこにあるのに、同じ姿を見せない。</p>
        <p>それは、木が奏でるサウンドスケープ。</p>
        <p>30秒間、耳をすませ、目を閉じると、ずっと時代を旅してきた音が、聞こえる。</p>
        <p>ある9月の音のメッセージ。</p>
      </div>
      <div class="poem-text" id="poem-text"></div>
    </div>

    <!-- 右下：作品情報 -->
    <div class="work-info">
      <div class="work-title">30 SECONDS : THROUGH THE WINDOW</div>
      <div class="work-year">2026</div>
      <img src="./images/nora-1.png" alt="nora signature" class="signature">
    </div>

  </div>

  <script>
    const tracks = {
      'morning': {
        imageId: 'img-morning',
        audioSrc: 'audio/01_morning.mp3',
        poem: '薄暗い中の機械音が、昨日と今日の境目になる。'
      },
      'daytime': {
        imageId: 'img-daytime',
        audioSrc: 'audio/02_daytime.mp3',
        poem: '繰り返される営みが、風に乗り、横切ってゆく。'
      },
      'wind': {
        imageId: 'img-wind',
        audioSrc: 'audio/03_wind.mp3',
        poem: '確実に吹かれ、ぶつかりあい、駆け抜けている。'
      },
      'rain': {
        imageId: 'img-rain',
        audioSrc: 'audio/04_rain.mp3',
        poem: '空からの無数の雫が、あの時の記憶を連れ戻す。'
      },
      'last_train': {
        imageId: 'img-last_train',
        audioSrc: 'audio/05_last_train.mp3',
        poem: '近くて遠い轍の音が、１日の終わりを告げる。'
      },
      'night': {
        imageId: 'img-night',
        audioSrc: 'audio/06_night.mp3',
        poem: '不確実かつ均衡を保つ、それが生命力になる。'
      }
    };

    let currentAudio = null;
    let timerInterval = null;
    let resetTimeout = null;

    function playTrack(key) {
      stopCurrent();

      const track = tracks[key];
      if (!track) return;

      // 1. 画像切り替え
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      const targetImg = document.getElementById(track.imageId);
      if (targetImg) targetImg.classList.add('active');

      // 2. ボタンアクティブ切り替え
      document.querySelectorAll('.track-btn').forEach(btn => {
        if (btn.getAttribute('onclick').includes(`'${key}'`)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 3. コンセプトを消し、再生中の詩を表示
      document.getElementById('concept-area').classList.add('is-hidden');
      const poemEl = document.getElementById('poem-text');
      poemEl.innerText = track.poem;
      requestAnimationFrame(() => poemEl.classList.add('visible'));

      // 4. 音声の再生
      currentAudio = new Audio(track.audioSrc);
      currentAudio.addEventListener('ended', resetToBase, { once: true });
      currentAudio.play().catch(e => console.log("Audio play error:", e));

      // 5. プログレスバー（10秒）
      const progressBar = document.getElementById('timer-bar');
      progressBar.style.width = '0%';
      let elapsed = 0;
      const duration = 30000;

      timerInterval = setInterval(() => {
        elapsed += 100;
        const progress = (elapsed / duration) * 100;
        progressBar.style.width = `${Math.min(progress, 100)}%`;
        if (elapsed >= duration) {
          clearInterval(timerInterval);
        }
      }, 100);

      // 6. 10秒後リセット
      resetTimeout = setTimeout(() => {
        resetToBase();
      }, 30000);
    }

    function stopCurrent() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
      if (timerInterval) clearInterval(timerInterval);
      if (resetTimeout) clearTimeout(resetTimeout);

      document.getElementById('concept-area').classList.add('is-hidden');
      document.getElementById('poem-text').classList.remove('visible');
      document.getElementById('timer-bar').style.width = '0%';
    }

    function resetToBase() {
      stopCurrent();
      
      document.querySelectorAll('.window-image').forEach(img => img.classList.remove('active'));
      document.getElementById('img-base').classList.add('active');

      document.querySelectorAll('.track-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('poem-text').classList.remove('visible');
      document.getElementById('concept-area').classList.remove('is-hidden');
    }

  </script>
</body>
</html>
